[project]
name = "agentaudit-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for AgentAudit — submit compliance questions to the deployed orchestration agent and inspect the audit trail."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "boto3>=1.34",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# BLE001 (no blind `except Exception`) is ignored deliberately: both
# agentcore_client.py and app.py's audit-tab handler catch broad
# exceptions on purpose, converting network/DB failures into a clean UI
# error instead of crashing the Streamlit page — a considered design
# choice, not an oversight a linter should flag.
ignore = ["BLE001"]
